name: Trabalho de Conclusao Testes de API

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup do ambiente Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Instalação das dependências
      - name: Install dependencies
        run: npm ci

      # 4. Inicialização da API
      - name: Start API
        run: npm run start
        env:
          NODE_ENV: test
          API_KEY: ${{ secrets.API_KEY }}

      # 5. Execução dos testes
      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          API_KEY: ${{ secrets.API_KEY }}