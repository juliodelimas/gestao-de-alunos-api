name: Testes de API

on:
  push:
    branches: [main, trabalho-extra]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar credenciais efêmeras de teste
        shell: bash
        run: |
          admin_password="$(openssl rand -base64 32 | tr -d '\n')"
          student_password="$(openssl rand -base64 32 | tr -d '\n')"
          new_student_password="$(openssl rand -base64 32 | tr -d '\n')"
          invalid_password="$(openssl rand -base64 32 | tr -d '\n')"
          {
            echo "JWT_SECRET=$(openssl rand -hex 32)"
            echo "SEED_ADMIN_PASSWORD=${admin_password}"
            echo "SEED_STUDENT_PASSWORD=${student_password}"
            echo "TEST_ADMIN_EMAIL=admin@escola.com"
            echo "TEST_ADMIN_PASSWORD=${admin_password}"
            echo "TEST_STUDENT_EMAIL=ana.souza@example.com"
            echo "TEST_STUDENT_PASSWORD=${student_password}"
            echo "TEST_NEW_STUDENT_PASSWORD=${new_student_password}"
            echo "TEST_INVALID_PASSWORD=${invalid_password}"
            echo "TEST_UNKNOWN_EMAIL=nao-existe@example.com"
          } >> "$GITHUB_ENV"

      - name: Executar testes
        run: npm test
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/gestao-de-alunos-test
